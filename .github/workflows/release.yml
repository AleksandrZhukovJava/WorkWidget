name: Release

# Push a tag like v0.2.0 → build the Windows installer in the cloud and publish a GitHub Release
# with the installer + latest.yml (auto-update feed). Use `npm run release:patch|minor|major`
# then `git push --follow-tags` to trigger this. See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload assets via GITHUB_TOKEN

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - name: Build & publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build; no code-signing certificate
